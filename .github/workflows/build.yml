name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Zbuduj erofs-utils (arm64, NDK)
        run: |
          sudo apt-get install -y -qq autoconf automake libtool pkg-config >/dev/null
          bash .github/scripts/build-erofs.sh
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Uprawnienia w APK (privapp)
        run: find app/build/intermediates -name AndroidManifest.xml -path "*merged_manifest*" | head -1 | xargs grep -o 'uses-permission[^/]*' || true
      - uses: actions/upload-artifact@v4
        with:
          name: FrankenFlasher-build${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
