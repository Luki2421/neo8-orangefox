name: Neo8 - validate source patches

on:
  push:
    paths:
      - .github/workflows/neo8-port-check.yml
      - port-sources.json
      - patches/fox16/**
      - files/neo8-restore-identity.sh
      - files/neo8-keymint-bootstrap.sh
      - scripts/fetch_port_sources.py
      - scripts/prepare_neo8_port.py
      - scripts/boot_ramdisk.py
      - scripts/inspect_recovery.py
      - scripts/neo8_service_config.py
      - scripts/prepare_neo8_build.py
      - scripts/prepare_ci_swap.py
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo8-port-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read project files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install host test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends g++ libsqlite3-dev liblz4-1 binutils

      - name: Test ramdisk reader against malformed archives and links
        run: python3 tests/test_ramdisk_reader.py

      - name: Test stock property publication and independent HAL startup
        run: python3 tests/test_keymint_bootstrap.py

      - name: Test swap sizing without modifying the host
        run: python3 tests/test_ci_swap.py

      - name: Test recovery service configuration
        run: python3 tests/test_service_config.py

      - name: Fetch pinned source code without device firmware
        run: python3 scripts/fetch_port_sources.py --output /tmp/neo8-port-sources

      - name: Apply source changes
        run: |
          python3 scripts/prepare_neo8_port.py \
            --recovery-root /tmp/neo8-port-sources/recovery \
            --vold-root /tmp/neo8-port-sources/vold \
            --neo8-root /tmp/neo8-port-sources/neo8 \
            --report artifacts/neo8-port/source-check.json

      - name: Apply manual preparation menu patch
        run: |
          git -C /tmp/neo8-port-sources/recovery apply --check "$GITHUB_WORKSPACE/patches/fox16/neo8-manual-menu.patch"
          git -C /tmp/neo8-port-sources/recovery apply "$GITHUB_WORKSPACE/patches/fox16/neo8-manual-menu.patch"
          git -C /tmp/neo8-port-sources/recovery apply --check "$GITHUB_WORKSPACE/patches/fox16/neo8-runtime.patch"
          git -C /tmp/neo8-port-sources/recovery apply "$GITHUB_WORKSPACE/patches/fox16/neo8-runtime.patch"
          git -C /tmp/neo8-port-sources/recovery apply --check "$GITHUB_WORKSPACE/patches/fox16/neo8-storage-init.patch"
          git -C /tmp/neo8-port-sources/recovery apply "$GITHUB_WORKSPACE/patches/fox16/neo8-storage-init.patch"
          git -C /tmp/neo8-port-sources/recovery apply --check "$GITHUB_WORKSPACE/patches/fox16/neo8-auto-startup.patch"
          git -C /tmp/neo8-port-sources/recovery apply "$GITHUB_WORKSPACE/patches/fox16/neo8-auto-startup.patch"
          git -C /tmp/neo8-port-sources/recovery apply --check "$GITHUB_WORKSPACE/patches/fox16/neo8-post-decrypt-mtp.patch"
          git -C /tmp/neo8-port-sources/recovery apply "$GITHUB_WORKSPACE/patches/fox16/neo8-post-decrypt-mtp.patch"
          git -C /tmp/neo8-port-sources/recovery apply --check "$GITHUB_WORKSPACE/patches/fox16/neo8-usb-switch.patch"
          git -C /tmp/neo8-port-sources/recovery apply "$GITHUB_WORKSPACE/patches/fox16/neo8-usb-switch.patch"
          git -C /tmp/neo8-port-sources/recovery apply --check "$GITHUB_WORKSPACE/patches/fox16/neo8-polish-labels.patch"
          git -C /tmp/neo8-port-sources/recovery apply "$GITHUB_WORKSPACE/patches/fox16/neo8-polish-labels.patch"
          git -C /tmp/neo8-port-sources/recovery apply --check "$GITHUB_WORKSPACE/patches/fox16/neo8-no-lock-recovery.patch"
          git -C /tmp/neo8-port-sources/recovery apply "$GITHUB_WORKSPACE/patches/fox16/neo8-no-lock-recovery.patch"
          git -C /tmp/neo8-port-sources/recovery diff --check

      - name: Test deferred storage initialization from the real startup path
        run: python3 tests/test_storage_init.py --recovery-root /tmp/neo8-port-sources/recovery

      - name: Test manual preparation handler on host
        run: python3 tests/test_manual_prepare.py --recovery-root /tmp/neo8-port-sources/recovery

      - name: Test real Make to Soong flag export
        run: |
          python3 tests/test_soong_flags.py \
            --recovery-root /tmp/neo8-port-sources/recovery \
            --vendor-root /tmp/neo8-port-sources/vendor_twrp

      - name: Test startup and KeyMint upgrade handling on host
        run: |
          python3 tests/test_startup_and_key_guard.py \
            --recovery-root /tmp/neo8-port-sources/recovery \
            --vold-root /tmp/neo8-port-sources/vold

      - name: Test keystore snapshot with synthetic WAL database
        run: python3 tests/test_keystore_snapshot.py --vold-root /tmp/neo8-port-sources/vold

      - name: Test service-stop failures before database and property changes
        run: python3 tests/test_keystore_service_stop.py --vold-root /tmp/neo8-port-sources/vold

      - name: Test metadata-first preparation and bounded touch wait
        run: python3 tests/test_metadata_environment.py --recovery-root /tmp/neo8-port-sources/recovery

      - name: Test MTP after decryption
        run: python3 tests/test_post_decrypt_mtp.py --recovery-root /tmp/neo8-port-sources/recovery

      - name: Test ordered USB mode switching
        run: python3 tests/test_usb_switch.py --recovery-root /tmp/neo8-port-sources/recovery

      - name: Test empty-credential protector detection
        run: python3 tests/test_no_lock.py --vold-root /tmp/neo8-port-sources/vold

      - name: Display scope of this check
        if: always()
        run: |
          echo 'Source patches and host tests only. No Android recovery image was compiled; phone decryption remains unverified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Save source report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neo8-source-check
          path: artifacts/neo8-port/
          retention-days: 7
          if-no-files-found: warn
